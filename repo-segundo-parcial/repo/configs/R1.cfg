! ===== R1 (IOS 12.4) =====
hostname R1
no ip domain-lookup
ip domain-name lab.local
enable secret CAMBIAR_ENABLE
service password-encryption
username admin privilege 15 secret CAMBIAR_ADMIN

interface FastEthernet0/0
 description Enlace a SW-1 Gi0/0
 ip address 10.7.1.1 255.255.255.0
 no shutdown

! --- DHCP para la LAN ---
ip dhcp excluded-address 10.7.1.1 10.7.1.99
ip dhcp excluded-address 10.7.1.201 10.7.1.254
ip dhcp pool LAN
 network 10.7.1.0 255.255.255.0
 default-router 10.7.1.1
 dns-server 10.7.1.10
exit

! --- SSH (sin Telnet) ---
crypto key generate rsa general-keys modulus 2048
ip ssh version 2

! --- AAA solo en consola y auxiliar ---
aaa new-model
radius-server host 10.7.1.10 auth-port 1812 acct-port 1813 key CAMBIAR_RADIUS
aaa group server radius NPS-GRP
 server 10.7.1.10 auth-port 1812 acct-port 1813
aaa authentication login default local
aaa authentication login CON-AUX group NPS-GRP local
aaa authorization exec CON-AUX group NPS-GRP local

line con 0
 login authentication CON-AUX
 authorization exec CON-AUX
 exec-timeout 5 0
 logging synchronous
line aux 0
 login authentication CON-AUX
 authorization exec CON-AUX
 exec-timeout 5 0
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 5 0
end
write memory
