! ===== SW-1 (IOSvL2) =====
hostname SW-1
no ip domain-lookup
ip domain-name lab.local
enable secret CAMBIAR_ENABLE
service password-encryption
username admin privilege 15 secret CAMBIAR_ADMIN

interface Vlan1
 ip address 10.7.1.2 255.255.255.0
 no shutdown
ip default-gateway 10.7.1.1

! --- Enlace al router (sin port-security) ---
interface GigabitEthernet0/0
 description Enlace a R1 f0/0
 switchport mode access
 no shutdown

! --- Puertos de servidores (VMs de VMware: emiten MAC adicionales, sin port-security) ---
interface GigabitEthernet0/1
 description W-SERVER
 switchport mode access
 no shutdown
interface GigabitEthernet0/2
 description ZABBIX
 switchport mode access
 no shutdown

! --- Puerto de acceso de usuario con port-security ---
interface GigabitEthernet0/3
 description PC-USUARIO
 switchport mode access
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 no shutdown

! --- SSH (sin Telnet) ---
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
line vty 0 15
 login local
 transport input ssh

! --- SNMP solo lectura, limitado al Zabbix ---
access-list 10 permit host 10.7.1.11
snmp-server community CAMBIAR_COMUNIDAD RO 10
end
write memory
